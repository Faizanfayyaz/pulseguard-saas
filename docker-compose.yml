version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: pulseguard-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pulseguard_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-pulseguard}
      MYSQL_USER: ${DB_USER:-pulseguard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pulseguard_secret_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis-queue:
    image: redis:7-alpine
    container_name: pg_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ping-worker:
    build:
      context: ./ping-worker
      dockerfile: Dockerfile
    container_name: pulseguard-ping-worker
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pulseguard}
      DB_USER: ${DB_USER:-pulseguard_user}
      DB_PASSWORD: ${DB_PASSWORD:-pulseguard_secret_pass}
      DB_CONNECTION_LIMIT: 10
      POLL_INTERVAL_MS: 3000
      WORKER_BATCH_SIZE: 25
      HEARTBEAT_PATH: /tmp/pulseguard/heartbeat
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('fs'); try { const ts = parseInt(fs.readFileSync('/tmp/pulseguard/heartbeat', 'utf8').trim(), 10); if (Date.now() - ts > 30000) process.exit(1); } catch (e) { process.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: pulseguard-api-server
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pulseguard}
      DB_USER: ${DB_USER:-pulseguard_user}
      DB_PASSWORD: ${DB_PASSWORD:-pulseguard_secret_pass}
      DB_CONNECTION_LIMIT: 20
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: pulseguard-web-dashboard
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  backend_net:
    driver: bridge
    name: pulseguard_backend_net
  frontend_net:
    driver: bridge
    name: pulseguard_frontend_net

volumes:
  mysql_data:
    driver: local
    name: pulseguard_mysql_data
  redis_data:
    driver: local
    name: pulseguard_redis_data

